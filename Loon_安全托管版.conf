# Loon.conf
# 陈老师安全托管版
# 用于 GitHub 公开托管
# 不包含机场订阅、节点、Token、账号信息

[General]
dns-server = system,223.5.5.5,223.6.6.6,1.1.1.1
sni-sniffing = true
ipv6-vif = off

[Proxy]

[Proxy Group]
🚀 节点选择 = select,PROXY,DIRECT
🤖 AI = select,🚀 节点选择,DIRECT
🌍 国外服务 = select,🚀 节点选择,DIRECT
📺 流媒体 = select,🚀 节点选择,DIRECT

[Rule]
# 国内常用服务直连
DOMAIN-SUFFIX,weixin.qq.com,DIRECT
DOMAIN-SUFFIX,wx.qq.com,DIRECT
DOMAIN-SUFFIX,qq.com,DIRECT
DOMAIN-SUFFIX,alipay.com,DIRECT
DOMAIN-SUFFIX,taobao.com,DIRECT
DOMAIN-SUFFIX,jd.com,DIRECT
DOMAIN-SUFFIX,zhihu.com,DIRECT
DOMAIN-SUFFIX,douyin.com,DIRECT
DOMAIN-SUFFIX,toutiao.com,DIRECT
DOMAIN-SUFFIX,xiaohongshu.com,DIRECT
DOMAIN-SUFFIX,bilibili.com,DIRECT
DOMAIN-SUFFIX,meituan.com,DIRECT
DOMAIN-SUFFIX,amap.com,DIRECT

# AI
DOMAIN-SUFFIX,openai.com,🤖 AI
DOMAIN-SUFFIX,chatgpt.com,🤖 AI
DOMAIN-SUFFIX,anthropic.com,🤖 AI
DOMAIN-SUFFIX,claude.ai,🤖 AI
DOMAIN-SUFFIX,gemini.google.com,🤖 AI

# 海外服务
DOMAIN-SUFFIX,google.com,🌍 国外服务
DOMAIN-SUFFIX,youtube.com,📺 流媒体
DOMAIN-SUFFIX,telegram.org,🌍 国外服务
DOMAIN-SUFFIX,github.com,🌍 国外服务

# 其他未匹配流量
FINAL,🚀 节点选择

[Host]

[Rewrite]

[Script]

